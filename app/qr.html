<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>CIS Map door labels</title>
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192">
  <style>
    @font-face {
      font-family: "Hanken Grotesk"; font-style: normal; font-weight: 100 900; font-display: swap;
      src: url("fonts/hanken-grotesk-latin.woff2") format("woff2");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: "Hanken Grotesk"; font-style: normal; font-weight: 100 900; font-display: swap;
      src: url("fonts/hanken-grotesk-latin-ext.woff2") format("woff2");
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }
    :root {
      --red: #DA291C; --ink: #3D3935; --ink-2: #6B6662; --ink-3: #736D68; --line: #E8E6E2; --surface-2: #F5F4F1;
      --font: "Hanken Grotesk", -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); color: var(--ink); background: #ECEAE6; }
    .bar { background: #fff; box-shadow: 0 1px 0 var(--line); padding: 12px 20px; display: flex; align-items: center; gap: 14px; }
    .bar img { height: 22px; display: block; }
    .bar h1 { flex: 1; font-size: 14px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2); }
    .bar button { font: inherit; font-weight: 700; font-size: 14px; height: 34px; min-width: 52px; padding: 0 12px; border-radius: 17px;
      background: var(--surface-2); border: 0; color: var(--ink); cursor: pointer; }
    .controls {
      display: flex; flex-wrap: wrap; gap: 14px 20px; align-items: end;
      padding: 16px 20px; background: #fff; border-bottom: 1px solid var(--line);
    }
    .controls label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: var(--ink-3); letter-spacing: 0.04em; }
    .controls input[type=url] { width: min(420px, 80vw); }
    .controls input[type=search] { width: min(260px, 80vw); }
    .controls input, .controls select { font: inherit; font-size: 14px; color: var(--ink); padding: 7px 9px; border: 1px solid #D0D0CE; border-radius: 8px; background: #fff; }
    .controls .checks { display: flex; flex-direction: row; gap: 12px; align-items: center; font-size: 13px; font-weight: 500; color: var(--ink-2); padding-bottom: 8px; }
    .controls .checks label { flex-direction: row; gap: 5px; align-items: center; font-size: 13px; font-weight: 500; color: var(--ink-2); letter-spacing: 0; }
    .controls button { font: inherit; font-weight: 700; font-size: 14px; padding: 9px 18px; border-radius: 20px; border: 0; background: var(--red); color: #fff; cursor: pointer; }
    .controls button:disabled { opacity: 0.45; cursor: default; }
    .status { width: 100%; font-size: 13px; color: var(--ink-2); }
    .status.bad { color: #B21F15; font-weight: 700; }
    .note { width: 100%; font-size: 12.5px; color: var(--ink-3); max-width: 70ch; }

    /* The label, after the brand guide's door plate: the room number first and big, its names under
       it, the floor; then the code, what it does in both languages, and the lockup. 62 x 68 mm,
       twelve to an A4 page. */
    .sheet { display: grid; grid-template-columns: repeat(auto-fill, 62mm); gap: 6mm; padding: 10mm; justify-content: center; }
    .label {
      width: 62mm; height: 68mm; background: #fff; border: 0.3mm dashed #B9B5AF; border-radius: 2.5mm; overflow: hidden;
      display: flex; flex-direction: column; break-inside: avoid; position: relative;
      padding: 4.6mm 4mm 3.6mm;
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
    .label::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1.6mm; background: var(--red); }
    .label > * { flex: none; min-width: 0; }
    /* every name whole: shrunk to fit by qrsheet.js, never cut with "…" */
    .label .code { font-size: 10.5mm; font-weight: 800; letter-spacing: -0.04em; line-height: 1; white-space: nowrap;
      font-variant-numeric: tabular-nums; overflow: hidden; }
    /* a place with no number (Stairs 5, Toilets, Canteen Level 1): its name in the number's place, smaller, two lines */
    .label .code.named { font-size: 6.4mm; letter-spacing: -0.02em; line-height: 1.08; white-space: normal; }
    .label .name { font-size: 3.4mm; font-weight: 700; line-height: 1.22; margin-top: 1.2mm; overflow: hidden; }
    .label .name .zh { font-weight: 500; }
    .label .where { font-size: 2.8mm; color: var(--ink-2); line-height: 1.3; margin-top: 0.6mm; }
    .label-foot { margin-top: auto; display: flex; gap: 3mm; align-items: stretch; }
    /* the code is the label's point: 30 mm whatever the name */
    .label-foot svg { width: 30mm; height: 30mm; flex: none; display: block; }
    /* the words and the lockup line up with the code's black squares, not its white margin (owner,
       1 Nov: the lockup's baseline on the code's bottom edge): --quiet is that margin, set per code by
       qrsheet.js (a longer link is a bigger code with smaller squares); the first line's capitals
       start 0.6 mm into its line */
    .label-side { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-between;
      padding: calc(var(--quiet, 1.8mm) - 0.6mm) 0 var(--quiet, 1.8mm); }
    .label .scan { font-size: 2.9mm; font-weight: 700; line-height: 1.25; color: var(--red); }
    .label .lockup { width: 100%; height: auto; display: block; }
    .label.fail { outline: 1mm solid #B21F15; }
    .label.tight { outline: 1mm dashed #B21F15; }

    @media print {
      @page { size: A4; margin: 7mm; }
      body { background: #fff; }
      .bar, .controls { display: none; }
      .sheet { padding: 0; gap: 3mm; grid-template-columns: repeat(3, 62mm); }
    }
  </style>
</head>
<body>
  <header class="bar"><img src="icons/cis-map-logo.svg" alt="CIS Map"><h1 data-s="title">Door labels</h1>
    <button type="button" id="btn-lang">中文</button></header>
  <form class="controls" id="controls" onsubmit="return false">
    <label><span data-s="base">Each code opens</span> <input type="url" id="base" required></label>
    <label><span data-s="floor">Floor</span> <select id="floor"></select></label>
    <label><span data-s="find">Find a label</span> <input type="search" id="find" autocomplete="off"></label>
    <div class="checks">
      <label><input type="checkbox" id="k-room" checked> <span data-s="rooms">rooms</span></label>
      <label><input type="checkbox" id="k-stair" checked> <span data-s="stairs">stairs</span></label>
      <label><input type="checkbox" id="k-lift" checked> <span data-s="lifts">lifts</span></label>
    </div>
    <button type="button" id="print" data-s="print">Print</button>
    <p class="status" id="status" aria-live="polite"></p>
    <p class="note" data-s="note">Each label's code opens the map with that door as the starting point, marked "you are here".</p>
  </form>
  <main class="sheet" id="sheet"></main>
  <script type="module" src="qrsheet.js"></script>
</body>
</html>
